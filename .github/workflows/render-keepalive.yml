name: Keep Render backend warm

on:
  schedule:
    # Offset runs from the start of the hour to reduce scheduled-run delays.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the Render health endpoint
        env:
          # Override this repository variable when checking a different Render service (for example staging).
          RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || 'https://rupio-api.onrender.com' }}
        run: |
          if [[ "$RENDER_BACKEND_URL" != https://* ]]; then
            echo "RENDER_BACKEND_URL must start with https:// and contain only the service origin."
            exit 1
          fi

          echo "Checking Render health at ${RENDER_BACKEND_URL%/}/health"
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            "${RENDER_BACKEND_URL%/}/health"
